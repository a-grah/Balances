name: Release

# Builds the Developer ID-signed, notarized, stapled DMG via scripts/release.sh.
#   - Pushing a tag like v1.7 publishes the DMG as a GitHub release.
#   - Running it by hand (Actions → Release → Run workflow) only uploads the DMG
#     as a workflow artifact.
#
# Secrets live in the "release" environment so only this workflow can read them:
#   DEVELOPER_ID_P12_BASE64    base64 of the exported "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD  the password the .p12 was exported with
#   NOTARY_API_KEY_BASE64      base64 of the App Store Connect API key (.p8)
#   NOTARY_API_KEY_ID          that key's Key ID
#   NOTARY_API_ISSUER_ID       the App Store Connect Issuer ID

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and package
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check the tag matches MARKETING_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(xcodebuild -project Balances.xcodeproj -scheme Balances -configuration Release \
            -showBuildSettings 2>/dev/null | awk -F' = ' '/ MARKETING_VERSION /{print $2; exit}')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"
            exit 1
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer_id.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$keychain" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer_id.p12"

          security find-identity -v -p codesigning "$keychain"

      - name: Write the notary API key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"

      - name: Build, sign, notarize, and package
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary_key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/release.sh

      - name: Upload the DMG as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Balances-dmg
          path: dist/Balances-*.dmg
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Balances-*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Balances-*.dmg \
              --title "Balances ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/developer_id.p12"
