name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # The seed JSON holds private data and is git-ignored, so it is not in
      # the repository. The app bundle references these resources, so create
      # empty placeholders to let the build's resource-copy step succeed.
      # (SeedImporter treats an empty "[]" file as "nothing to seed".)
      - name: Create placeholder seed data
        run: |
          mkdir -p Balances/Resources
          [ -f Balances/Resources/balances_seed.json ] || echo '[]' > Balances/Resources/balances_seed.json
          [ -f Balances/Resources/tsx_seed.json ] || echo '[]' > Balances/Resources/tsx_seed.json

      - name: Build
        run: |
          xcodebuild -project Balances.xcodeproj -scheme Balances \
            -configuration Release -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
